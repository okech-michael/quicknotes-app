<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts, one note at a time.</p>
  </header>
  <main>
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-field">
          <label for="note-input">Note</label>
          <input type="text" id="note-input" name="note" autocomplete="off">
        </div>
        <div class="form-field">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input type="search" id="search-input" placeholder="Search by note text">
      <p id="note-count" aria-live="polite">You have no notes yet.</p>
      <ul id="notes-list" aria-label="Saved notes"></ul>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
